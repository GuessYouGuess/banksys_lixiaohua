# CI:PR/push 触发,门禁 = 格式 + 静态检查 + 单元测试(覆盖率) + 构建
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Format check
        run: ruff format --check .

      - name: Static check
        run: ruff check .

      - name: Tests with coverage
        run: pytest --cov --cov-fail-under=80

  build:
    name: docker build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --build-arg PIP_INDEX_URL=https://pypi.org/simple -t banksys_lixiaohua:latest .
